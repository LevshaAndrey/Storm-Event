# Local development database (infra/compose.yaml). Activate with
# --spring.profiles.active=postgres
spring.datasource.url=jdbc:postgresql://localhost:5432/${POSTGRES_DB:storm}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${POSTGRES_USER:storm}
spring.datasource.password=${POSTGRES_PASSWORD:storm}
spring.jpa.hibernate.ddl-auto=update
