spring.application.name=task

# Local database (H2 in memory). For Postgres replace url, driver, username and password.
spring.datasource.url=jdbc:h2:mem:taskdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# LLM intent parser (Spring AI). OpenRouter is OpenAI-compatible.
spring.ai.openai.base-url=${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
spring.ai.openai.api-key=${OPENROUTER_API_KEY:sk-local-placeholder}
spring.ai.openai.chat.options.model=${OPENROUTER_MODEL:openai/gpt-4o-mini}
app.llm.enabled=false

# AtlasBus web search API.
app.atlas.base-url=https://atlasbus.by
app.atlas.search-path=/api/search
app.atlas.locale=ru
app.atlas.project-identifier=morda
app.atlas.application-source=web
app.atlas.fuzzy-max-distance=6
